# OpsBoard hidden oracle — the product invariants a WORKING SaaS must satisfy.
# NEVER placed in any agent workspace (P8). Checked behaviourally through the
# public surface (handle/render), not by inspecting agent internals.
#
# Each invariant is tagged:
#   kind: required   -> intrinsic to any working SaaS OR stated in PRD/ticket  -> scored as conformance
#   kind: consistency-> arbitrary product decision; scored as self-consistency over sessions
# (see REALWORLD_DESIGN.md §8: conformance vs consistency).

state_machine:
  kind: required           # stated in PRD
  entity: task
  field: status
  transitions:
    draft: [submitted]
    submitted: [approved, rejected]
    approved: [scheduled]
    rejected: []
    scheduled: [completed]
    completed: []
  rule: "any transition not listed must be refused (status 409); status must never
         change except via the dedicated endpoint for that transition."

permissions:
  kind: required           # stated in PRD: approver = org admin or project owner
  approve_task: {allowed_roles: [org_admin, project_owner]}
  reject_task:  {allowed_roles: [org_admin, project_owner]}
  rule: "a member calling approve/reject gets 403 (or 404 to hide existence);
         and the privileged action must ALSO be blocked at the API even if the FE hides the button."

existence_hiding:
  kind: required           # stated in PRD: unauthorized users can't even know it exists
  scope: "cross-org access AND privileged actions (approve/reject) by an unprivileged actor"
  rule: "when an actor performs a privileged action it is not allowed to perform, or
         touches a task in another org, the response is 404 (not 403) — so the actor
         cannot distinguish 'forbidden' from 'absent'. (Per-task visibility WITHIN an org
         is not part of this benchmark: any member of an org may read that org's tasks.)"

multi_tenant:
  kind: required           # intrinsic: a SaaS must not leak across orgs
  every_query_scoped_by: org_id
  rule: "an actor with org_id=A must never read, mutate, or see in any list/dashboard/
         search/audit a row belonging to org_id=B. Cross-org id access returns 404."

scheduling:
  kind: required           # stated in PRD: no schedule conflict
  rule: "schedule_task only allowed from status=approved; two scheduled tasks in the
         same project must not occupy the same slot (second gets 409)."

cache_dashboard:
  kind: required           # intrinsic: a cache that serves stale data after a mutation is a bug
  key_must_include: [org_id]
  invalidate_on: [task_created, task_status_changed, task_scheduled]
  rule: "get_dashboard may be cached, but after any of the listed mutations the next
         get_dashboard for that org must reflect the change (no stale counts).
         The cache key must include org_id (else cross-org dashboard bleed)."

post_approval_edit:
  kind: required           # SEEDED in PRD/ticket as [title, scope, owner] -> conformance
  forbidden_fields: [title, scope, owner]
  rule: "once a task is approved (or beyond), update_task changing any forbidden field
         is refused (409/400) and must not persist; non-core fields may still change."

audit_trail:
  kind: required           # stated in PRD: changes must be traceable
  rule: "every status change, schedule change and permission-relevant action appends an
         audit entry retrievable via list_audit, scoped to the actor's org."
